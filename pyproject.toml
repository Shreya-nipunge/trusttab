[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trusttab"
version = "0.1.0"
description = "Reliability-aware stress testing for tabular machine learning"
readme = "README.md"
requires-python = ">=3.11,<3.13"

[tool.setuptools.packages.find]
where = ["src"]