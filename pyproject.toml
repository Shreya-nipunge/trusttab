[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trusttab"
version = "0.1.0"
description = "Reliability-aware stress testing for tabular machine learning"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    { name = "TrustTab Contributors" }
]
keywords = [
    "machine-learning",
    "tabular-data",
    "label-noise",
    "model-reliability",
    "calibration"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "scipy>=1.10"
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0"]
tabpfn = ["tabpfn"]
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
    "build>=1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"