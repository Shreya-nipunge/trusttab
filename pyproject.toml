[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trusttab"
version = "0.1.0"
description = "Reliability-aware stress testing for tabular machine learning"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "TrustTab Contributors" }
]
keywords = [
    "machine-learning",
    "tabular-data",
    "label-noise",
    "model-reliability",
    "calibration"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.6",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "scipy>=1.10"
]

[project.urls]
Homepage = "https://github.com/Shreya-nipunge/trusttab"
Repository = "https://github.com/Shreya-nipunge/trusttab"
Documentation = "https://github.com/Shreya-nipunge/trusttab/tree/main/docs"
Issues = "https://github.com/Shreya-nipunge/trusttab/issues"
Changelog = "https://github.com/Shreya-nipunge/trusttab/blob/main/CHANGELOG.md"

[project.scripts]
trusttab = "trusttab.experiments.run:main"

[project.optional-dependencies]
xgboost = ["xgboost>=2.0"]
tabpfn = ["tabpfn==10.0.0"]
dev = [
    "pytest>=7.0",
    "ruff==0.5.7",
    "build>=1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
exclude = [
    # Legacy files not formatted by the project formatter; keep this allowlist
    # until each file can be reformatted in a focused cleanup.
    "src/trusttab/__init__.py",
    "src/trusttab/data/__init__.py",
    "src/trusttab/data/adult.py",
    "src/trusttab/data/german_credit.py",
    "src/trusttab/data/preprocessing.py",
    "src/trusttab/evaluation/metrics.py",
    "src/trusttab/evaluation/operating_region.py",
    "src/trusttab/experiments/runner.py",
    "src/trusttab/models/__init__.py",
    "src/trusttab/models/model_factory.py",
    "src/trusttab/noise/feature_shift.py",
    "src/trusttab/noise/label_noise.py",
    "src/trusttab/statistics/comparison.py",
    "src/trusttab/visualization/reliability.py",
    "tests/test_adult.py",
    "tests/test_benchmark.py",
    "tests/test_calibration.py",
    "tests/test_data.py",
    "tests/test_experiments.py",
    "tests/test_feature_shift.py",
    "tests/test_metrics.py",
    "tests/test_models.py",
    "tests/test_noise.py",
    "tests/test_operating_region.py",
    "tests/test_package.py",
    "tests/test_preprocessing.py",
    "tests/test_statistics.py",
    "tests/test_tabpfn_adapter.py",
    "tests/test_visualization.py",
]
