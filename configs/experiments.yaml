
project:
  name: TrustTab
  version: "0.1.0"

dataset:
  name: german_credit

experiments:
  test_size: 0.2

  noise_levels:
    - 0.0
    - 0.1
    - 0.2
    - 0.3
    - 0.4

  seeds:
    - 0
    - 1
    - 2
    - 3
    - 4

models:
  - logistic_regression
  - random_forest
  - xgboost

output:
  directory: results
  filename: stress_test_results.csv
