project:
  name: TrustTab Phase 3 smoke test
  version: "0.1.0"

dataset:
  name: german_credit

experiments:
  test_size: 0.2
  noise_levels: [0.0, 0.2]
  seeds: [0]

models:
  - logistic_regression
  - random_forest

model_params:
  logistic_regression:
    max_iter: 500
  random_forest:
    n_estimators: 10
    n_jobs: 1

output:
  directory: results
  filename: phase3_smoke_test.csv
